# The public demo: invented data, a private copy for every visitor, no
# login, a simulated node, and uploads off. Nothing is kept: copies are
# deleted after a few idle hours, and all of them when the container
# restarts.
#
# The image is built by GitHub Actions and published to GitHub's container
# registry as ghcr.io/<owner>/<repo>-demo, tagged with each commit and
# :latest; this file runs it. Set BTCTAX_DEMO_IMAGE to that name (with a
# commit tag to pin one). A private image needs a one-time
# `docker login ghcr.io` with a token that can read packages. To build it
# locally instead: docker build --target demo -t btctax-demo .
#
# The assistant uses a model in Amazon Bedrock (Llama 3.3 70B by default)
# with the machine's AWS role, which needs bedrock:InvokeModel on the model's
# inference profile and its foundation models. Put the demo behind HTTPS
# (your reverse proxy), not straight on the internet.
services:
  btctax-demo:
    image: ${BTCTAX_DEMO_IMAGE:?set BTCTAX_DEMO_IMAGE, e.g. ghcr.io/<owner>/<repo>-demo:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"   # your reverse proxy forwards to this
    environment:
      AWS_REGION: us-east-1
      # BTCTAX_BEDROCK_MODEL: us.meta.llama3-3-70b-instruct-v1:0   # or us.amazon.nova-pro-v1:0, anthropic.claude-haiku-5-5...
      # BTCTAX_DEMO_AI: "false"            # turn the assistant off
      # BTCTAX_DEMO_AI_PER_VISITOR: "20"   # questions per visitor
      # BTCTAX_DEMO_AI_PER_DAY: "300"      # questions per day, for everyone
      # BTCTAX_DEMO_MAX_COPIES: "100"      # visitors' copies kept at once
      # BTCTAX_DEMO_IDLE_HOURS: "3"        # a copy unused this long is deleted
