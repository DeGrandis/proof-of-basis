# .github/workflows/images.yml
#
# Tests, then builds the images from this commit and pushes them to
# GitHub's container registry, tagged with its SHA (and :latest):
#   ghcr.io/<owner>/<repo>       the app people run
#   ghcr.io/<owner>/<repo>-demo  the public demo (the same app, in demo mode)
#   ghcr.io/<owner>/<repo>-site  the landing page (site/)
# The names follow the repository, so renaming it renames the images. All
# come from the same commit in the same run, so the demo is always exactly
# the app at that commit. Pull requests test and build them without
# pushing. No secrets are needed: the run's own token publishes the images.
#
# The app image is built for amd64 and arm64 (Umbrel and StartOS boxes run
# both); the demo and the landing page only for amd64, where they run. Pushing a version tag
# (git tag v1.2.3) also publishes the images as :1.2.3, with the version
# stamped into the app, for the Umbrel and StartOS packages to pin.
#
# The app image must not carry the demo: a check below fails the run if the
# app's program pulls in the demo's code or the AWS/Anthropic libraries.
name: Build images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test (the demo's parity tests included)
        run: |
          go vet ./...
          go test ./...

      - name: The app people run carries no demo code
        run: |
          if go list -deps ./cmd/btctax | grep -E '/internal/(sandbox|claude|converse)$|anthropic-sdk-go|aws-sdk-go'; then
            echo "cmd/btctax imports demo-only packages (listed above); keep them in cmd/btctax-demo."
            exit 1
          fi

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: app
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - target: demo
            suffix: "-demo"
            platforms: linux/amd64
          - target: site
            suffix: "-site"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for git describe

      - name: Image name (from the repository; registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Tags and version (the commit always; latest from master; the version from a v* tag)
        run: |
          {
            echo 'TAGS<<EOF'
            echo "$IMAGE:$GITHUB_SHA"
            if [ "$GITHUB_REF" = refs/heads/master ]; then echo "$IMAGE:latest"; fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$IMAGE:${GITHUB_REF_NAME#v}"; fi
            echo EOF
          } >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; else echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"; fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }} for ${{ matrix.platforms }} (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
