# .github/workflows/images.yml
#
# Tests, then builds both images from this commit and pushes them to
# GitHub's container registry, tagged with its SHA (and :latest):
#   ghcr.io/<owner>/<repo>       the app people run
#   ghcr.io/<owner>/<repo>-demo  the public demo (the same app, in demo mode)
# The names follow the repository, so renaming it renames the images. Both
# come from the same commit in the same run, so the demo is always exactly
# the app at that commit. Pull requests test and build both without
# pushing. No secrets are needed: the run's own token publishes the images.
#
# The app image must not carry the demo: a check below fails the run if the
# app's program pulls in the demo's code or the AWS/Anthropic libraries.
name: Build images

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test (the demo's parity tests included)
        run: |
          go vet ./...
          go test ./...

      - name: The app people run carries no demo code
        run: |
          if go list -deps ./cmd/btctax | grep -E 'btctax/internal/(sandbox|claude)|anthropic-sdk-go|aws-sdk-go'; then
            echo "cmd/btctax imports demo-only packages (listed above); keep them in cmd/btctax-demo."
            exit 1
          fi

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: app
            suffix: ""
          - target: demo
            suffix: "-demo"
    steps:
      - uses: actions/checkout@v4

      - name: Image name (from the repository; registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }} (cached, tagged with the commit SHA and latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
