# .github/workflows/images.yml
#
# Tests, then builds both images from this commit and pushes them to Docker
# Hub tagged with its SHA (and :latest):
#   degrandis/btctax       the app people run
#   degrandis/btctax-demo  the public demo (the same app, in demo mode)
# Both come from the same commit in the same run, so the demo is always
# exactly the app at that commit. Pull requests test and build both without
# pushing.
#
# The app image must not carry the demo: a check below fails the run if the
# app's program pulls in the demo's code or the AWS/Anthropic libraries.
name: Build images

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test (the demo's parity tests included)
        run: |
          go vet ./...
          go test ./...

      - name: The app people run carries no demo code
        run: |
          if go list -deps ./cmd/btctax | grep -E 'btctax/internal/(sandbox|claude)|anthropic-sdk-go|aws-sdk-go'; then
            echo "cmd/btctax imports demo-only packages (listed above); keep them in cmd/btctax-demo."
            exit 1
          fi

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            image: degrandis/btctax
          - target: demo
            image: degrandis/btctax-demo
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.target }} (cached, tagged with the commit SHA and latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
