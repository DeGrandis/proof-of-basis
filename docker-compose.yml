# Example: run next to your node. Point the app at your Fulcrum server in
# Settings (for example the host's LAN IP, or a service name on the same
# Docker network as Fulcrum).
services:
  btctax:
    image: btctax:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"             # reachable from your LAN; the app asks for a password
    environment:
      # The first visit sets the login password. Or set it here; it then
      # replaces the stored password each time the app starts:
      # BTCTAX_PASSWORD: change-me
      # Forgot it? docker compose exec btctax /btctax reset-password
      BTCTAX_ADDR: 0.0.0.0:8080
    extra_hosts:
      # Lets the optional assistant reach Ollama on this same machine at
      # http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    volumes:
      - btctax-data:/data
volumes:
  btctax-data:
